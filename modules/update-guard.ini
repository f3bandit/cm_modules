; update-guard for Console Mode (the app link runs it): restore points of MiSTer's Main, the menu core, the
; kernel and Linux, made before Update All runs from the app. Settings inside Linux (SSH keys, the hostname...)
; are kept too, to be put back after a Linux update.
SYSTEM_FILES="MiSTer|menu.rbf|linux/zImage_dtb|linux/linux.img"
KEEP_POINTS="3"
POINTS_DIR="/media/fat/ConsoleMode/ss1/guard/restore-points"
